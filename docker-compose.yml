# Local SQL Server for Pulse development. Matches the Prisma `sqlserver` provider so the schema
# behaves the same as Azure SQL later.
#
#   docker compose up -d db
#   DATABASE_URL="sqlserver://localhost:1433;database=Pulse;user=sa;password=Pulse_Dev_Passw0rd!;encrypt=true;trustServerCertificate=true"
#   npm run db:push && npm run db:generate
#
# Change the password in both places if you prefer; it is a local-only credential.
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: pulse-sql
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: 'Pulse_Dev_Passw0rd!'
      MSSQL_PID: Developer
    ports:
      - '1433:1433'
    volumes:
      - pulse-sql-data:/var/opt/mssql
    healthcheck:
      test: ['CMD-SHELL', "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Pulse_Dev_Passw0rd!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pulse-sql-data:
